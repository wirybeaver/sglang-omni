config_cls: StreamingCascadePipelineConfig
model_path: examples/streaming_cascade/profiles/ming3-audio

services:
  - name: chat
    command: [sgl-omni, serve, --model-path, inclusionAI/Ming-3.0-audio-flash, --thinker.tp_size, "2", --host, "127.0.0.1", --port, "8003"]
    port: 8003
    env: {CUDA_VISIBLE_DEVICES: "0,1"}

session_nodes:
  vad:
    stages: [vad]
    inputs: [input]
  dialog:
    kind: audio_dialog
    inputs:
      - "input:pcm16"
      - "input:session"
      - "vad:session"
      - {source: "llm:text_delta", feedback: true, overflow: drop_oldest, capacity: 1024}
      - {source: "tts:session", feedback: true, overflow: drop_oldest, capacity: 1024}
      - {kind: control, source: input, event: interrupt}
      - {kind: control, source: aligner, event: reply.progress}
    system_prompt: Listen to the user's audio and reply concisely in their language.
  llm:
    kind: openai_chat
    model: inclusionAI/Ming-3.0-audio-flash
    base_url: http://127.0.0.1:8003/v1
    inputs:
      - dialog
      - {kind: control, source: dialog, event: interrupt}
  tts:
    kind: openai_speech
    model: inclusionAI/Ming-3.0-audio-flash
    base_url: http://127.0.0.1:8003/v1
    stream: false
    reference_audio_path: examples/streaming_cascade/voices/vivian.wav
    reference_text: Hi there, it is nice to meet you, and I am happy to help with whatever you need today.
    inputs:
      - llm
      - {kind: control, source: dialog, event: interrupt}
  aligner:
    kind: alignment
    method: sentence
    inputs: ["llm:text_delta", "tts:pcm_f32le", "tts:session", "dialog:session"]

session_publish:
  vad: [session]
  dialog: [session]
  llm: [text_delta]
  tts: [pcm_f32le, session]
  aligner: [session]
